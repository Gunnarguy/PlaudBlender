<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body, #graph-container { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #070a12;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      }
      #graph-container {
        position: relative;
        background-color: #070a12;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 65%),
          radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
          radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 24px 24px;
      }
      svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
      .lane { fill: rgba(15, 23, 42, 0.85); stroke: rgba(51, 65, 85, 0.6); stroke-width: 1.2; rx: 18px; }
      .lane-title { fill: #f8fafc; font-size: 13px; font-weight: 800; letter-spacing: -0.2px; }
      .lane-subtitle { fill: #94a3b8; font-size: 10px; }
      .category-card { stroke-width: 1.5; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.4)); transition: all 0.25s ease; cursor: pointer; }
      .category-label { fill: #ffffff; font-size: 12.5px; font-weight: 800; letter-spacing: -0.1px; }
      .category-count { fill: rgba(255,255,255,0.9); font-size: 10px; font-weight: 700; }
      .topic-card { fill: rgba(30, 41, 59, 0.95); stroke: rgba(71, 85, 105, 0.6); stroke-width: 1.2; transition: all 0.2s ease; cursor: pointer; }
      .topic-label { fill: #f8fafc; font-size: 11.5px; font-weight: 700; }
      .topic-count { fill: #38bdf8; font-size: 10.5px; font-weight: 800; }
      .topic-link { fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: 0.6; filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.4)); }
      .relationship { fill: none; stroke: #f59e0b; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 6 4; animation: dash 1.5s linear infinite; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7)); }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .topic-link, .relationship { pointer-events: none; }
      .selected .topic-card { fill: rgba(14, 165, 233, 0.3); stroke: #38bdf8; stroke-width: 2.5; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6)); }
      .selected .category-card { filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.7)); stroke-width: 2.5; }
      .selected .topic-label, .selected .category-label { font-weight: 800; }
      .dimmed { opacity: 0.2; filter: grayscale(60%); }
      .more-label { fill: #64748b; font-size: 10.5px; font-weight: 600; }
      .rank-number { fill: #38bdf8; font-size: 12px; font-weight: 800; }
      .axis-label { fill: #94a3b8; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
      .empty { fill: #64748b; font-size: 14px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main id="graph-container" aria-label="Knowledge graph"></main>
    <script>
      (() => {
        const container = document.getElementById("graph-container");
        const state = {
          payload: { nodes: [], edges: [] },
          layout: "lanes",
          selectedNodeId: null,
          positions: new Map(),
          viewport: { x: 0, y: 0, width: 360, height: 420 },
          content: { width: 360, height: 420 },
          pointers: new Map(),
          pinchDistance: null,
          pinchZoom: 1,
        };

        const post = (name, value) => {
          try { window.webkit?.messageHandlers?.[name]?.postMessage(value); } catch (_) {}
        };

        const escapeHTML = (value) => String(value ?? "").replace(/[&<>'"]/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        }[char]));
        const cleanLabel = (value, max = 30) => {
          const text = String(value ?? "Untitled").trim();
          return text.length > max ? `${text.slice(0, Math.max(1, max - 1)).trimEnd()}…` : text;
        };
        const metric = node => Number(node.mentionCount ?? node.mention_count ?? node.count ?? 0);
        const normalize = value => String(value ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const colorFor = node => node.color || (node.type === "category" ? "#0969da" : "#64748b");
        const asNode = raw => raw?.data || raw || {};
        const asEdge = raw => raw?.data || raw || {};

        const graph = () => {
          const nodes = (state.payload.nodes || []).map(asNode).filter(node => node.id);
          const edges = (state.payload.edges || []).map(asEdge).filter(edge => edge.source && edge.target);
          return { nodes, edges, byID: new Map(nodes.map(node => [node.id, node])) };
        };

        const categoriesFor = node => Array.isArray(node.categories)
          ? node.categories
          : String(node.categories || "").split(",").map(item => item.trim()).filter(Boolean);

        const categoryGroups = (nodes) => {
          const categories = nodes.filter(node => node.type === "category").sort((a, b) => metric(b) - metric(a) || String(a.label).localeCompare(String(b.label)));
          const lookup = new Map();
          categories.forEach(category => {
            lookup.set(normalize(category.id), category);
            lookup.set(normalize(category.label), category);
          });
          const groups = new Map(categories.map(category => [category.id, []]));
          const uncategorized = [];
          nodes.filter(node => node.type !== "category").forEach(node => {
            const firstCategory = categoriesFor(node).map(normalize).map(key => lookup.get(key)).find(Boolean);
            if (firstCategory) groups.get(firstCategory.id).push(node);
            else uncategorized.push(node);
          });
          if (uncategorized.length) {
            const fallback = { id: "__uncategorized", label: "Other topics", color: "#64748b", type: "category", count: uncategorized.length };
            categories.push(fallback);
            groups.set(fallback.id, uncategorized);
          }
          groups.forEach(items => items.sort((a, b) => metric(b) - metric(a) || String(a.label).localeCompare(String(b.label))));
          return { categories, groups };
        };

        const point = (id, x, y, width, height) => state.positions.set(id, { x, y, width, height, centerX: x + width / 2, centerY: y + height / 2 });
        const clearPositions = () => state.positions.clear();
        const nodeIsRelated = (nodeID, edges) => {
          if (!state.selectedNodeId) return true;
          return nodeID === state.selectedNodeId || edges.some(edge =>
            (edge.source === state.selectedNodeId && edge.target === nodeID) ||
            (edge.target === state.selectedNodeId && edge.source === nodeID)
          );
        };

        const card = (node, x, y, width, height, kind = "topic") => {
          const selected = node.id === state.selectedNodeId;
          const related = nodeIsRelated(node.id, graph().edges);
          const className = `${kind === "category" ? "category-card" : "topic-card"}${selected ? " selected" : ""}${related ? "" : " dimmed"}`;
          const title = escapeHTML(node.fullLabel || node.full_label || node.label || node.id);
          const count = metric(node);
          point(node.id, x, y, width, height);
          if (kind === "category") {
            const color = colorFor(node);
            return `<g class="${className}" role="button" tabindex="0" aria-label="${title}, category" data-node-id="${escapeHTML(node.id)}">
              <rect class="category-card" x="${x}" y="${y}" width="${width}" height="${height}" rx="12" fill="${color}" stroke="${color}" />
              <text class="category-label" x="${x + 12}" y="${y + 23}">${escapeHTML(cleanLabel(node.label, 21))}</text>
              <text class="category-count" x="${x + 12}" y="${y + 40}">${count} ${count === 1 ? "event" : "events"}</text>
            </g>`;
          }
          return `<g class="${className}" role="button" tabindex="0" aria-label="${title}, ${count} mentions" data-node-id="${escapeHTML(node.id)}">
            <rect class="topic-card" x="${x}" y="${y}" width="${width}" height="${height}" rx="10" />
            <circle cx="${x + 12}" cy="${y + height / 2}" r="4" fill="${colorFor(node)}" />
            <text class="topic-label" x="${x + 22}" y="${y + height / 2 + 4}">${escapeHTML(cleanLabel(node.label, Math.max(12, Math.floor(width / 10))))}</text>
            <text class="topic-count" text-anchor="end" x="${x + width - 10}" y="${y + height / 2 + 4}">${count}</text>
          </g>`;
        };

        const link = (from, to, color, relationship = false) => {
          if (!from || !to) return "";
          return `<path class="${relationship ? "relationship" : "topic-link"}" stroke="${color}" d="M ${from.centerX} ${from.centerY} C ${from.centerX + 34} ${from.centerY}, ${to.centerX - 34} ${to.centerY}, ${to.centerX} ${to.centerY}" />`;
        };

        const renderLanes = (data, width, height) => {
          const { categories, groups } = categoryGroups(data.nodes);
          const maxVisible = 4;
          const pad = 14, categoryWidth = Math.min(136, Math.max(106, width * .32));
          const gap = 12, topicX = pad + categoryWidth + gap, topicWidth = width - topicX - pad;
          let y = pad;
          let background = "", cards = "", primaryLinks = "", moreLabels = "";
          categories.forEach(category => {
            const topics = groups.get(category.id) || [];
            const visible = topics.slice(0, maxVisible);
            const laneHeight = Math.max(72, visible.length * 42 + (topics.length > maxVisible ? 24 : 0) + 18);
            background += `<rect class="lane" x="${pad}" y="${y}" width="${width - pad * 2}" height="${laneHeight}" rx="16" />`;
            cards += card(category, pad + 10, y + Math.max(12, (laneHeight - 52) / 2), categoryWidth - 20, 52, "category");
            visible.forEach((topic, index) => {
              const topicY = y + 10 + index * 42;
              cards += card(topic, topicX, topicY, topicWidth, 32);
              primaryLinks += link(state.positions.get(category.id), state.positions.get(topic.id), colorFor(category));
            });
            if (!topics.length) {
              moreLabels += `<text class="more-label" x="${topicX + 2}" y="${y + laneHeight / 2 + 3}">No repeated specific topics yet</text>`;
            }
            if (topics.length > maxVisible) {
              moreLabels += `<text class="more-label" x="${topicX + 2}" y="${y + laneHeight - 10}">+ ${topics.length - maxVisible} more — tap ${escapeHTML(cleanLabel(category.label, 18))} to inspect</text>`;
            }
            y += laneHeight + 12;
          });
          state.content = { width, height: Math.max(height, y + 4) };
          return `${background}${primaryLinks}${cards}${moreLabels}`;
        };

        const renderRanked = (data, width, height) => {
          const topics = data.nodes.filter(node => node.type !== "category").sort((a, b) => metric(b) - metric(a) || String(a.label).localeCompare(String(b.label)));
          const maxVisible = 14, pad = 18, rowHeight = 42;
          let markup = `<text class="axis-label" x="${pad}" y="24">MOST MENTIONED TOPICS</text>`;
          topics.slice(0, maxVisible).forEach((topic, index) => {
            const y = 38 + index * rowHeight;
            markup += `<text class="rank-number" x="${pad}" y="${y + 21}">${index + 1}</text>`;
            markup += card(topic, pad + 28, y, width - pad * 2 - 28, 32);
          });
          if (topics.length > maxVisible) markup += `<text class="more-label" x="${pad + 28}" y="${38 + maxVisible * rowHeight + 5}">+ ${topics.length - maxVisible} additional topics in this graph</text>`;
          state.content = { width, height: Math.max(height, 38 + Math.min(maxVisible, topics.length) * rowHeight + 36) };
          return markup;
        };

        const renderTimeline = (data, width, height) => {
          const topics = data.nodes.filter(node => node.type !== "category").sort((a, b) => Number(a.avg_ts || 0) - Number(b.avg_ts || 0));
          const maxVisible = 12, pad = 24, rowHeight = 48, lineX = 30;
          let markup = `<text class="axis-label" x="${pad}" y="24">EARLIER</text><text class="axis-label" text-anchor="end" x="${width - pad}" y="24">LATER</text>`;
          markup += `<path d="M ${lineX} 42 L ${lineX} ${54 + Math.min(topics.length, maxVisible) * rowHeight}" stroke="#c7d2e0" stroke-width="2" />`;
          topics.slice(0, maxVisible).forEach((topic, index) => {
            const y = 42 + index * rowHeight;
            markup += `<circle cx="${lineX}" cy="${y + 16}" r="6" fill="${colorFor(topic)}" />`;
            markup += card(topic, 50, y, width - 68, 32);
          });
          if (topics.length > maxVisible) markup += `<text class="more-label" x="50" y="${42 + maxVisible * rowHeight + 8}">+ ${topics.length - maxVisible} additional topics</text>`;
          state.content = { width, height: Math.max(height, 42 + Math.min(maxVisible, topics.length) * rowHeight + 40) };
          return markup;
        };

        const selectedRelationships = (data) => {
          if (!state.selectedNodeId) return "";
          return data.edges
            .filter(edge => edge.source === state.selectedNodeId || edge.target === state.selectedNodeId)
            .sort((a, b) => Number(b.weight || 0) - Number(a.weight || 0))
            .slice(0, 6)
            .map(edge => link(state.positions.get(edge.source), state.positions.get(edge.target), "#f59e0b", true))
            .join("");
        };

        const clampViewport = () => {
          const maxX = Math.max(0, state.content.width - state.viewport.width);
          const maxY = Math.max(0, state.content.height - state.viewport.height);
          state.viewport.x = Math.max(0, Math.min(state.viewport.x, maxX));
          state.viewport.y = Math.max(0, Math.min(state.viewport.y, maxY));
        };

        const render = () => {
          const rect = container.getBoundingClientRect();
          const width = Math.max(280, Math.round(rect.width || 360));
          const height = Math.max(260, Math.round(rect.height || 420));
          const data = graph();
          if (!data.nodes.length) {
            container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img"><text class="empty" x="${width / 2}" y="${height / 2}" text-anchor="middle">No graph data to show yet.</text></svg>`;
            return;
          }
          const priorWidth = state.viewport.width;
          const priorHeight = state.viewport.height;
          if (!state.viewport.width || Math.abs(priorWidth - width) > 2 || Math.abs(priorHeight - height) > 2) {
            state.viewport.width = width;
            state.viewport.height = height;
          }
          clearPositions();
          let markup;
          if (state.layout === "concentric") markup = renderRanked(data, width, height);
          else if (state.layout === "circle") markup = renderTimeline(data, width, height);
          else markup = renderLanes(data, width, height);
          markup += selectedRelationships(data);
          clampViewport();
          container.innerHTML = `<svg id="knowledge-map" viewBox="${state.viewport.x} ${state.viewport.y} ${state.viewport.width} ${state.viewport.height}" role="img" aria-label="Knowledge map. Select a category or topic for its strongest connections.">${markup}</svg>`;
          bindEvents();
        };

        const updateViewBox = () => {
          const svg = document.getElementById("knowledge-map");
          if (svg) svg.setAttribute("viewBox", `${state.viewport.x} ${state.viewport.y} ${state.viewport.width} ${state.viewport.height}`);
        };

        const selectNode = id => {
          state.selectedNodeId = state.selectedNodeId === id ? null : id;
          render();
          post("nodeTapped", state.selectedNodeId);
        };

        const bindEvents = () => {
          const svg = document.getElementById("knowledge-map");
          if (!svg) return;
          svg.querySelectorAll("[data-node-id]").forEach(element => {
            element.addEventListener("click", event => { event.stopPropagation(); selectNode(element.dataset.nodeId); });
            element.addEventListener("keydown", event => {
              if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(element.dataset.nodeId); }
            });
          });
          let start = null;
          const distance = () => {
            const points = [...state.pointers.values()];
            return points.length === 2 ? Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y) : null;
          };
          svg.addEventListener("pointerdown", event => {
            svg.setPointerCapture(event.pointerId);
            state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            start = { x: event.clientX, y: event.clientY, viewX: state.viewport.x, viewY: state.viewport.y };
            state.pinchDistance = distance();
            state.pinchZoom = state.viewport.width;
          });
          svg.addEventListener("pointermove", event => {
            if (!state.pointers.has(event.pointerId)) return;
            state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
            const currentDistance = distance();
            if (state.pinchDistance && currentDistance) {
              const scale = state.pinchDistance / currentDistance;
              const targetWidth = Math.max(150, Math.min(state.content.width, state.pinchZoom * scale));
              const ratio = targetWidth / state.viewport.width;
              state.viewport.width = targetWidth;
              state.viewport.height *= ratio;
              clampViewport(); updateViewBox();
            } else if (start) {
              state.viewport.x = start.viewX - (event.clientX - start.x);
              state.viewport.y = start.viewY - (event.clientY - start.y);
              clampViewport(); updateViewBox();
            }
          });
          const finish = event => { state.pointers.delete(event.pointerId); state.pinchDistance = distance(); start = null; };
          svg.addEventListener("pointerup", finish);
          svg.addEventListener("pointercancel", finish);
        };

        window.updateGraph = (payload, layoutName, selectedNodeID) => {
          state.payload = payload || { nodes: [], edges: [] };
          state.layout = ["lanes", "concentric", "circle"].includes(layoutName) ? layoutName : "lanes";
          state.selectedNodeId = selectedNodeID || null;
          state.viewport.x = 0; state.viewport.y = 0;
          requestAnimationFrame(() => { render(); post("graphReady", "ready"); });
        };
        window.setSelectedNode = nodeID => { state.selectedNodeId = nodeID || null; render(); };
        window.addEventListener("resize", () => render());
      })();
    </script>
  </body>
</html>
