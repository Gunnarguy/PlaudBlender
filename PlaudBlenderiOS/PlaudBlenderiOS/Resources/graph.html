<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
      html, body, #graph-container { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #070a12; }
      body {
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      }
      canvas { display: block; width: 100%; height: 100%; }

      /* Top-Right Compact Mini HUD Controls Bar */
      #hud-overlay {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 100;
      }
      .hud-btn {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #f8fafc;
        width: 34px;
        height: 34px;
        border-radius: 17px;
        font-size: 13px;
        font-weight: 800;
        backdrop-filter: blur(16px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .hud-btn.active {
        background: rgba(56, 189, 248, 0.3);
        border-color: #38bdf8;
        color: #38bdf8;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      }
      .hud-btn:active {
        transform: scale(0.9);
      }

      /* Inspector Tooltip Card */
      #inspector-card {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        padding: 10px 14px;
        backdrop-filter: blur(20px);
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.7);
        max-width: 240px;
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
        z-index: 100;
      }
      #inspector-card.active {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }
      .inspector-title { font-size: 13px; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
      .inspector-type { font-size: 9px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
      .inspector-meta { font-size: 10px; color: #94a3b8; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
      .inspector-close { font-size: 11px; color: #94a3b8; padding: 2px 4px; cursor: pointer; float: right; }
    </style>
  </head>
  <body>
    <div id="graph-container">
      <canvas id="3d-canvas"></canvas>
    </div>

    <div id="inspector-card">
      <span class="inspector-close" id="ins-close">✕</span>
      <div class="inspector-type" id="ins-type">3D Node</div>
      <div class="inspector-title" id="ins-title">Topic Name</div>
      <div class="inspector-meta">
        <span id="ins-cat">Category</span>
        <strong id="ins-count" style="color: #38bdf8;">0 mentions</strong>
      </div>
    </div>

    <div id="hud-overlay">
      <button class="hud-btn" id="btn-zoom-in" title="Zoom In">🔍+</button>
      <button class="hud-btn" id="btn-zoom-out" title="Zoom Out">🔍-</button>
      <button class="hud-btn active" id="btn-rotate" title="Auto Orbit">🔄</button>
      <button class="hud-btn" id="btn-reset" title="Recenter">🎯</button>
    </div>

    <script>
      (function() {
        const canvas = document.getElementById('3d-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('graph-container');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let rawData = { nodes: [], edges: [] };
        let currentLayout = "constellation3d";
        let selectedNodeId = null;

        // 3D Camera & Orbital Control State
        let isAutoRotating = true;
        let rotX = 0.25;
        let rotY = 0.45;
        let targetRotX = 0.25;
        let targetRotY = 0.45;
        let cameraDist = 450;
        let targetCameraDist = 450;
        let focusOffsetX = 0;
        let focusOffsetY = 0;
        let focusOffsetZ = 0;

        let calculated3DNodes = [];
        let calculated3DEdges = [];
        let stars = [];
        let pulseTime = 0;

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * window.devicePixelRatio;
          canvas.height = height * window.devicePixelRatio;
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Background Star Field
        for (let i = 0; i < 250; i++) {
          stars.push({
            x: (Math.random() - 0.5) * 2000,
            y: (Math.random() - 0.5) * 2000,
            z: (Math.random() - 0.5) * 2000,
            size: Math.random() * 1.8 + 0.5,
            opacity: Math.random() * 0.5 + 0.2
          });
        }

        function getCategoryHex(type, cat) {
          if (type === 'category') return '#38bdf8';
          const c = (cat || '').toLowerCase();
          if (c.includes('meeting')) return '#a855f7';
          if (c.includes('personal')) return '#ec4899';
          if (c.includes('reflection')) return '#10b981';
          if (c.includes('idea')) return '#f59e0b';
          return '#06b6d4';
        }

        // Spatially Segregated Category Galaxies (3x Distance Separation)
        const categoryHubCenters = {
          'meeting': { x: -600, y: 300, z: -450 },
          'personal': { x: 650, y: -250, z: -400 },
          'reflection': { x: -550, y: -400, z: 550 },
          'idea': { x: 600, y: 450, z: 450 },
          'misc': { x: 0, y: 700, z: -100 }
        };

        function getHubCenter(cat) {
          const c = (cat || 'misc').toLowerCase();
          if (c.includes('meeting')) return categoryHubCenters['meeting'];
          if (c.includes('personal')) return categoryHubCenters['personal'];
          if (c.includes('reflection')) return categoryHubCenters['reflection'];
          if (c.includes('idea')) return categoryHubCenters['idea'];
          return categoryHubCenters['misc'];
        }

        // Generate Spacious 3D Positions with Repulsion Physics
        function build3DLayout(nodes, edges, layout) {
          const count = nodes.length || 1;
          const nodeMap = {};
          const resultNodes = [];

          // 1. Initial Position Assignment per View Mode
          nodes.forEach((n, idx) => {
            let x = 0, y = 0, z = 0;
            const primaryCat = (n.categories && n.categories[0]) || n.label;
            const hub = getHubCenter(primaryCat);

            if (layout === "vectorSpace3d") {
              // Qdrant 3D vector space embedding projection (Radius 600)
              const hash = (n.id || n.label).split('').reduce((a,b)=>((a<<5)-a)+b.charCodeAt(0), 0);
              const angleX = Math.abs(hash % 360) * (Math.PI / 180);
              const angleY = Math.abs((hash >> 3) % 360) * (Math.PI / 180);
              const radius = 200 + (n.type === 'category' ? 0 : 380 * Math.sin(hash));

              x = radius * Math.cos(angleX) * Math.sin(angleY);
              y = radius * Math.sin(angleX) * Math.sin(angleY);
              z = radius * Math.cos(angleY);

            } else if (layout === "isometric25d") {
              // 2.5D Isometric spacious grid matrix
              const cols = Math.ceil(Math.sqrt(count));
              const row = Math.floor(idx / cols);
              const col = idx % cols;
              x = (col - cols/2) * 180;
              z = (row - cols/2) * 180;
              y = n.type === 'category' ? 90 : ((n.metricValue || n.count || 5) * 3.0);

            } else if (layout === "galaxyOrbit3d") {
              // 3D Galaxy Orbit around category star hubs
              if (n.type === 'category') {
                x = hub.x;
                y = hub.y;
                z = hub.z;
              } else {
                const angle = (idx / count) * Math.PI * 2;
                const dist = 140 + (idx % 5) * 60;
                x = hub.x + Math.cos(angle) * dist;
                z = hub.z + Math.sin(angle) * dist;
                y = hub.y + Math.sin(angle * 3) * 60;
              }

            } else if (layout === "volumetric3d") {
              // 3D Volumetric City Matrix
              const cols = Math.ceil(Math.sqrt(count));
              const row = Math.floor(idx / cols);
              const col = idx % cols;
              x = (col - cols/2) * 160;
              z = (row - cols/2) * 160;
              y = Math.sin(idx) * 120;

            } else {
              // 3D Neural Constellation (Spatially Segregated Category Systems)
              if (n.type === 'category') {
                x = hub.x;
                y = hub.y;
                z = hub.z;
              } else {
                const angle = (idx / count) * Math.PI * 2;
                const offsetRadius = 120 + (idx % 6) * 55;
                x = hub.x + Math.cos(angle) * offsetRadius + (Math.random() - 0.5) * 40;
                y = hub.y + Math.sin(angle) * offsetRadius + (Math.random() - 0.5) * 40;
                z = hub.z + Math.sin(angle * 2) * offsetRadius + (Math.random() - 0.5) * 40;
              }
            }

            const item = {
              ...n,
              x3d: x,
              y3d: y,
              z3d: z,
              colorHex: getCategoryHex(n.type, primaryCat),
              radius: n.type === 'category' ? 18 : Math.max(9, Math.min(16, (n.metricValue || n.count || 1) * 0.35))
            };
            nodeMap[n.id] = item;
            resultNodes.push(item);
          });

          // 2. Iterative Coulomb Force Repulsion Physics
          for (let iter = 0; iter < 10; iter++) {
            for (let i = 0; i < resultNodes.length; i++) {
              for (let j = i + 1; j < resultNodes.length; j++) {
                const n1 = resultNodes[i];
                const n2 = resultNodes[j];
                const dx = n2.x3d - n1.x3d;
                const dy = n2.y3d - n1.y3d;
                const dz = n2.z3d - n1.z3d;
                const dist = Math.hypot(dx, dy, dz) || 1;
                const minDist = (n1.radius + n2.radius) * 6.0;

                if (dist < minDist) {
                  const force = (minDist - dist) / dist * 0.35;
                  n1.x3d -= dx * force;
                  n1.y3d -= dy * force;
                  n1.z3d -= dz * force;
                  n2.x3d += dx * force;
                  n2.y3d += dy * force;
                  n2.z3d += dz * force;
                }
              }
            }
          }

          const resultEdges = [];
          edges.forEach(e => {
            if (nodeMap[e.source] && nodeMap[e.target]) {
              resultEdges.push({
                ...e,
                sourceNode: nodeMap[e.source],
                targetNode: nodeMap[e.target]
              });
            }
          });

          calculated3DNodes = resultNodes;
          calculated3DEdges = resultEdges;
        }

        // 3D Math & Project to 2D Screen
        function project3D(x, y, z) {
          const fx = x - focusOffsetX;
          const fy = y - focusOffsetY;
          const fz = z - focusOffsetZ;

          // Rotate around Y axis
          const cosY = Math.cos(rotY);
          const sinY = Math.sin(rotY);
          let x1 = fx * cosY - fz * sinY;
          let z1 = fz * cosY + fx * sinY;

          // Rotate around X axis
          const cosX = Math.cos(rotX);
          const sinX = Math.sin(rotX);
          let y2 = fy * cosX - z1 * sinX;
          let z2 = z1 * cosX + fy * sinX;

          // Perspective projection
          const fov = 400;
          const scale = fov / (fov + z2 + cameraDist);
          const sx = width / 2 + x1 * scale;
          const sy = height / 2 + y2 * scale;

          return { sx, sy, scale, zDepth: z2 };
        }

        // Render Frame Loop
        function renderFrame() {
          ctx.clearRect(0, 0, width, height);
          pulseTime += 0.03;

          if (isAutoRotating) {
            targetRotY += 0.002;
          }

          rotX += (targetRotX - rotX) * 0.08;
          rotY += (targetRotY - rotY) * 0.08;
          cameraDist += (targetCameraDist - cameraDist) * 0.08;

          // 0. Render Background Star Dust
          stars.forEach(st => {
            const p = project3D(st.x, st.y, st.z);
            if (p.scale > 0) {
              ctx.fillStyle = `rgba(56, 189, 248, ${st.opacity * p.scale})`;
              ctx.fillRect(p.sx, p.sy, st.size * p.scale, st.size * p.scale);
            }
          });

          // Project nodes
          const projectedNodes = calculated3DNodes.map(n => {
            const p = project3D(n.x3d, n.y3d, n.z3d);
            return { ...n, sx: p.sx, sy: p.sy, scale: p.scale, zDepth: p.zDepth };
          });

          // Sort by zDepth so distant nodes render behind near nodes
          projectedNodes.sort((a, b) => b.zDepth - a.zDepth);

          // 1. Draw 3D Connecting Laser Edges with Pulsing Data Particles
          calculated3DEdges.forEach(e => {
            const p1 = project3D(e.sourceNode.x3d, e.sourceNode.y3d, e.sourceNode.z3d);
            const p2 = project3D(e.targetNode.x3d, e.targetNode.y3d, e.targetNode.z3d);
            const isHighlighted = (selectedNodeId === e.source || selectedNodeId === e.target);

            ctx.strokeStyle = isHighlighted ? 'rgba(56, 189, 248, 0.95)' : 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = isHighlighted ? 2.5 : 1.2;

            ctx.beginPath();
            ctx.moveTo(p1.sx, p1.sy);
            ctx.lineTo(p2.sx, p2.sy);
            ctx.stroke();

            // Animated Energy Pulse Particle along line
            if (isHighlighted || Math.random() < 0.2) {
              const t = (pulseTime + (e.source.charCodeAt(0) || 0) * 0.1) % 1.0;
              const px = p1.sx + (p2.sx - p1.sx) * t;
              const py = p1.sy + (p2.sy - p1.sy) * t;

              ctx.fillStyle = '#38bdf8';
              ctx.beginPath();
              ctx.arc(px, py, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
          });

          // 2. Draw 3D Glowing Nodes & Selective Adaptive Text Labels
          projectedNodes.forEach(n => {
            const r = Math.max(5, n.radius * n.scale);
            const isSelected = selectedNodeId === n.id;
            const isCategory = n.type === 'category';

            // Node Outer Glow Halo
            const grad = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, r * (isSelected ? 3.5 : 2.5));
            grad.addColorStop(0, n.colorHex);
            grad.addColorStop(0.4, n.colorHex + '88');
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r * (isSelected ? 3.5 : 2.5), 0, Math.PI * 2);
            ctx.fill();

            // Core Sphere
            ctx.fillStyle = isSelected ? '#ffffff' : n.colorHex;
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
            ctx.fill();

            if (isSelected || isCategory) {
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = isCategory ? 2 : 2.5;
              ctx.stroke();
            }

            // Adaptive Label LOD: Text for Category Star Hubs, Selected Nodes, or Top nodes when zoomed in!
            const shouldShowText = isCategory || isSelected || n.scale > 0.65;

            if (shouldShowText) {
              const fontSize = Math.max(10, Math.round((isCategory ? 13 : 11) * n.scale));
              ctx.font = `${isCategory ? '800' : '600'} ${fontSize}px -apple-system, sans-serif`;
              const textWidth = ctx.measureText(n.label).width;

              // Glass Capsule backdrop
              ctx.fillStyle = isCategory ? 'rgba(15, 23, 42, 0.9)' : 'rgba(7, 10, 18, 0.75)';
              ctx.beginPath();
              ctx.roundRect(n.sx + r + 4, n.sy - fontSize/2 - 3, textWidth + 12, fontSize + 6, 6);
              ctx.fill();
              ctx.strokeStyle = isSelected ? '#38bdf8' : (isCategory ? 'rgba(56, 189, 248, 0.4)' : 'rgba(255, 255, 255, 0.12)');
              ctx.lineWidth = 1;
              ctx.stroke();

              // Text
              ctx.fillStyle = isSelected ? '#38bdf8' : (isCategory ? '#ffffff' : '#e2e8f0');
              ctx.fillText(n.label, n.sx + r + 10, n.sy + fontSize/2 - 2);
            }
          });

          requestAnimationFrame(renderFrame);
        }

        // --- NATIVE IOS MULTI-TOUCH GESTURE ENGINE ---
        let touchStartDist = 0;
        let startCameraDist = 450;
        let touchStartTime = 0;
        let touchStartPos = { x: 0, y: 0 };

        container.addEventListener('touchstart', e => {
          touchStartTime = Date.now();

          if (e.touches.length === 1) {
            isDragging = true;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            isAutoRotating = false;
            document.getElementById('btn-rotate').classList.remove('active');
          } else if (e.touches.length === 2) {
            isDragging = false;
            touchStartDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            startCameraDist = targetCameraDist;
          }
        }, { passive: true });

        container.addEventListener('touchmove', e => {
          if (e.touches.length === 1 && isDragging) {
            const dx = e.touches[0].clientX - lastMouse.x;
            const dy = e.touches[0].clientY - lastMouse.y;
            targetRotY += dx * 0.008;
            targetRotX += dy * 0.008;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          } else if (e.touches.length === 2 && touchStartDist > 0) {
            const currentDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const factor = touchStartDist / Math.max(currentDist, 1);
            targetCameraDist = Math.max(15, Math.min(2500, startCameraDist * factor));
          }
        }, { passive: true });

        container.addEventListener('touchend', e => {
          if (e.touches.length === 0) {
            const touchDuration = Date.now() - touchStartTime;
            const moveDist = Math.hypot(lastMouse.x - touchStartPos.x, lastMouse.y - touchStartPos.y);

            // Generous Touch Tap Hit-Testing (40px Radius)
            if (touchDuration < 300 && moveDist < 15) {
              handleTouchTap(lastMouse.x, lastMouse.y);
            }
            isDragging = false;
          }
        }, { passive: true });

        function handleTouchTap(tapX, tapY) {
          let clickedNode = null;
          let minDist = 9999;

          calculated3DNodes.forEach(n => {
            const p = project3D(n.x3d, n.y3d, n.z3d);
            const dist = Math.hypot(p.sx - tapX, p.sy - tapY);
            // Generous 40px touch radius
            if (dist < Math.max(40, n.radius * p.scale * 2.0) && dist < minDist) {
              minDist = dist;
              clickedNode = n;
            }
          });

          if (clickedNode) {
            selectedNodeId = clickedNode.id;
            showInspector(clickedNode);

            // Smoothly focus camera directly on node up close
            focusOffsetX = clickedNode.x3d;
            focusOffsetY = clickedNode.y3d;
            focusOffsetZ = clickedNode.z3d;
            targetCameraDist = 60;

            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nodeTapped) {
              window.webkit.messageHandlers.nodeTapped.postMessage(clickedNode.id);
            }
          }
        }

        function showInspector(node) {
          const card = document.getElementById('inspector-card');
          document.getElementById('ins-title').innerText = node.fullLabel || node.label;
          document.getElementById('ins-type').innerText = node.type;
          document.getElementById('ins-cat').innerText = (node.categories && node.categories.join(', ')) || 'General';
          document.getElementById('ins-count').innerText = `${node.metricValue || node.count || 0} mentions`;
          card.classList.add('active');
        }

        document.getElementById('ins-close').addEventListener('click', () => {
          document.getElementById('inspector-card').classList.remove('active');
          selectedNodeId = null;
        });

        // HUD Controls Action Bindings (Ultra Zoom Range 15 to 2500)
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
          targetCameraDist = Math.max(15, targetCameraDist - 120);
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
          targetCameraDist = Math.min(2500, targetCameraDist + 120);
        });

        // Mouse Wheel & Trackpad Zooming
        container.addEventListener('wheel', e => {
          targetCameraDist += e.deltaY * 0.4;
          targetCameraDist = Math.max(15, Math.min(2500, targetCameraDist));
        }, { passive: true });

        document.getElementById('btn-rotate').addEventListener('click', function() {
          isAutoRotating = !isAutoRotating;
          if (isAutoRotating) {
            this.classList.add('active');
          } else {
            this.classList.remove('active');
          }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
          targetRotX = 0.25;
          targetRotY = 0.45;
          targetCameraDist = 450;
          focusOffsetX = 0;
          focusOffsetY = 0;
          focusOffsetZ = 0;
          selectedNodeId = null;
          document.getElementById('inspector-card').classList.remove('active');
        });

        // Bridge functions for Swift WKWebView
        window.updateGraph = function(payload, layoutName, selectedNodeIdParam) {
          try {
            rawData = typeof payload === 'string' ? JSON.parse(payload) : payload;
            if (layoutName) currentLayout = layoutName;
            if (selectedNodeIdParam) selectedNodeId = selectedNodeIdParam;
            build3DLayout(rawData.nodes || [], rawData.edges || [], currentLayout);

            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.graphReady) {
              window.webkit.messageHandlers.graphReady.postMessage("ready");
            }
          } catch (err) {
            console.error("Graph render error:", err);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.graphError) {
              window.webkit.messageHandlers.graphError.postMessage(err.message || String(err));
            }
          }
        };

        window.renderGraph = window.updateGraph;
        window.setLayout = function(layoutName) {
          currentLayout = layoutName;
          build3DLayout(rawData.nodes || [], rawData.edges || [], currentLayout);
        };

        window.setSelectedNode = function(nodeId) {
          selectedNodeId = nodeId;
        };

        // Start render loop
        renderFrame();
      })();
    </script>
  </body>
</html>
