services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333" # Bind to localhost by default. Change to 0.0.0.0 only if you intentionally want LAN/public access.
    volumes:
      - ~/.qdrant_storage:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.25"
    networks:
      - plaud-network

networks:
  plaud-network:
    driver: bridge
